<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Leaderboard · JDP &amp; SN Travel Agency</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;0,900;1,900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="quiz.css?v=6" />
  <style>
    /* =========================================================
       PANEL EN VIVO · para proyectar en el video beam
       ========================================================= */
    .panel { flex: 1; display: grid; grid-template-columns: 320px 1fr; gap: 2rem; width: min(1400px, 94%); margin: 0 auto; padding: 0.5rem 0 2rem; }

    /* Columna izquierda: QR y contadores */
    .lado { display: flex; flex-direction: column; gap: 1.2rem; }
    .qr-card {
      background: var(--blanco); color: var(--azul); border-radius: 22px; padding: 1.1rem; text-align: center;
      border: 6px solid var(--amarillo); box-shadow: 8px 8px 0 #003893, 16px 16px 0 var(--rojo);
    }
    .qr-card img { width: 100%; display: block; }
    .qr-card strong { display: block; font-weight: 900; font-style: italic; font-size: 1.4rem; text-transform: uppercase; margin-top: 0.3rem; }
    .qr-card small { display: block; font-weight: 600; font-size: 0.72rem; color: #4f5b73; word-break: break-all; margin-top: 0.3rem; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
    .stat { background: #070b2e; border: 3px solid var(--plata); border-radius: 16px; padding: 0.8rem; text-align: center; }
    .stat b { display: block; font-size: 2.2rem; line-height: 1; }
    .stat span { font-size: 0.75rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--plata); }
    .controles { display: grid; gap: 0.8rem; }
    .controles .btn { width: 100%; text-align: center; padding: 0.9rem 1rem; font-size: 1rem; }

    /* Columna derecha: tabla */
    .tabla-wrap { background: rgba(7,11,46,0.88); border: 3px solid var(--plata); border-radius: 22px; padding: 1.4rem 1.6rem; box-shadow: 0 0 40px rgba(61,139,224,0.35); display: flex; flex-direction: column; min-width: 0; }
    .tabla-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
    .tabla-head h1 { font-weight: 900; font-style: italic; font-size: clamp(1.6rem, 3vw, 2.4rem); text-transform: uppercase; }
    .en-vivo { display: inline-flex; align-items: center; gap: 0.5rem; font-weight: 800; color: #ff6b78; letter-spacing: 2px; font-size: 0.85rem; }
    .en-vivo i { width: 12px; height: 12px; border-radius: 50%; background: var(--rojo); animation: latido 1.2s infinite; }
    @keyframes latido { 50% { opacity: 0.3; transform: scale(0.8); } }

    .filas { list-style: none; position: relative; display: grid; gap: 0.55rem; }
    .jugador {
      display: grid; grid-template-columns: 46px minmax(120px, 1.1fr) 2fr 110px; align-items: center; gap: 1rem;
      background: linear-gradient(90deg, #13205a, #0a1240); border: 2px solid rgba(201,211,230,0.35);
      border-radius: 14px; padding: 0.55rem 1rem;
      transition: transform 0.6s cubic-bezier(.2,.8,.2,1), background 0.3s;
    }
    .jugador.lider1 { border-color: #f5c518; box-shadow: 0 0 18px rgba(245,197,24,0.35); }
    .jugador.lider2 { border-color: #c0c7d1; }
    .jugador.lider3 { border-color: #cd7f32; }
    .jugador.cambio { animation: brillo 0.9s; }
    @keyframes brillo { 30% { background: linear-gradient(90deg, #2c5bd8, #13205a); } }
    .puesto { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; background: #1d2a6b; border: 2px solid rgba(255,255,255,0.4); }
    .jnombre { font-weight: 800; font-size: 1.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .jnombre small { display: block; font-size: 0.72rem; font-weight: 700; color: var(--plata); letter-spacing: 1px; text-transform: uppercase; }
    .progreso { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
    .progreso i { height: 14px; border-radius: 4px; background: rgba(255,255,255,0.12); }
    .progreso i.b { background: #2fd162; box-shadow: 0 0 8px rgba(47,209,98,0.6); }
    .progreso i.m { background: #e0384a; }
    .progreso i.a { background: var(--naranja); animation: latido 1.2s infinite; }
    .jpuntos { text-align: right; font-weight: 900; font-size: 1.5rem; color: var(--amarillo); }
    .jpuntos small { font-size: 0.55em; color: var(--plata); }
    .conexion { display: flex; align-items: center; gap: 0.5rem; font-weight: 700; font-size: 0.85rem; }
    .conexion i { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .conexion.ok { color: #8ff0a9; } .conexion.ok i { background: #2fd162; box-shadow: 0 0 8px #2fd162; }
    .conexion.prueba { color: var(--naranja); } .conexion.prueba i { background: var(--naranja); }
    .conexion.mal { color: #ff8a95; } .conexion.mal i { background: var(--rojo); }
    .vacio { text-align: center; padding: 3rem 1rem; color: var(--plata); font-weight: 700; font-size: 1.2rem; }

    /* =================== PODIO =================== */
    .podio {
      position: fixed; inset: 0; z-index: 40; display: none; flex-direction: column; align-items: center; justify-content: flex-end;
      background: radial-gradient(ellipse at 50% 30%, #4b2bb0 0%, transparent 60%), linear-gradient(180deg, #1a0b4d, #070726);
      padding: 2rem 2rem 0; overflow: hidden;
    }
    .podio.activo { display: flex; }
    .podio__titulo { position: absolute; top: 4%; left: 0; right: 0; text-align: center; font-weight: 900; font-style: italic; text-transform: uppercase; font-size: clamp(2rem, 5vw, 3.6rem); text-shadow: 0 5px 0 rgba(0,0,0,0.4); }
    .podio__titulo small { display: block; font-size: 0.35em; letter-spacing: 6px; color: var(--plata); font-style: normal; margin-top: 0.5rem; }
    .gradas { display: flex; align-items: flex-end; justify-content: center; gap: clamp(0.6rem, 2vw, 1.6rem); width: min(1000px, 100%); }
    .grada { flex: 1; display: flex; flex-direction: column; align-items: center; max-width: 300px; }
    .grada__info { text-align: center; margin-bottom: 1rem; opacity: 0; transform: translateY(30px); }
    .podio.activo .grada__info { animation: aparecer 0.6s forwards; }
    .grada__medalla {
      width: clamp(70px, 9vw, 110px); aspect-ratio: 1; border-radius: 50%; margin: 0 auto 0.7rem;
      display: grid; place-items: center; font-weight: 900; font-size: clamp(2rem, 4vw, 3rem);
      border: 5px solid rgba(255,255,255,0.8); box-shadow: 0 8px 24px rgba(0,0,0,0.45), inset 0 -6px 12px rgba(0,0,0,0.2);
    }
    .grada__nombre { font-weight: 900; font-size: clamp(1.2rem, 2.6vw, 2rem); max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .grada__pts { font-weight: 800; color: var(--amarillo); font-size: clamp(1rem, 2vw, 1.4rem); }
    .grada__bloque {
      width: 100%; border-radius: 16px 16px 0 0; display: grid; place-items: start center; padding-top: 1rem;
      font-weight: 900; font-size: clamp(3rem, 7vw, 6rem); color: rgba(0,0,0,0.25);
      height: 0; transition: height 1.2s cubic-bezier(.2,.8,.2,1);
      box-shadow: inset 0 8px 0 rgba(255,255,255,0.35);
    }
    .grada--oro .grada__medalla, .grada--oro .grada__bloque { background: var(--oro); color: #5a4300; }
    .grada--plata .grada__medalla, .grada--plata .grada__bloque { background: var(--plata-m); color: #3a414c; }
    .grada--bronce .grada__medalla, .grada--bronce .grada__bloque { background: var(--bronce); color: #3a1c06; }
    .grada__bloque { color: rgba(0,0,0,0.25) !important; }
    .podio.activo .grada--oro .grada__bloque { height: 46vh; transition-delay: 1.4s; }
    .podio.activo .grada--plata .grada__bloque { height: 34vh; transition-delay: 0.8s; }
    .podio.activo .grada--bronce .grada__bloque { height: 24vh; transition-delay: 0.2s; }
    .podio.activo .grada--bronce .grada__info { animation-delay: 1.1s; }
    .podio.activo .grada--plata .grada__info { animation-delay: 1.7s; }
    .podio.activo .grada--oro .grada__info { animation-delay: 2.4s; }
    .grada--vacia .grada__info { visibility: hidden; }
    .podio__cerrar { position: absolute; top: 1.2rem; right: 1.2rem; padding: 0.7rem 1.4rem; font-size: 0.9rem; z-index: 2; }

    @media (max-width: 900px) {
      .panel { grid-template-columns: 1fr; }
      .lado { flex-direction: row; flex-wrap: wrap; }
      .qr-card { width: 200px; }
      .stats, .controles { flex: 1; min-width: 220px; }
      .jugador { grid-template-columns: 40px 1fr 80px; }
      .progreso { grid-column: 1 / -1; order: 3; }
      .podio.activo .grada--oro .grada__bloque { height: 34vh; }
      .podio.activo .grada--plata .grada__bloque { height: 25vh; }
      .podio.activo .grada--bronce .grada__bloque { height: 17vh; }
    }
  </style>
</head>
<body>
  <div class="rayos"></div>

  <div class="app">
    <header class="top">
      <a href="index.html" class="top__logo"><img src="logo-jdpsn-small.webp" alt="JDP &amp; SN Travel Agency" /></a>
      <div class="top__right"><a href="index.html" class="volver">Back to site</a></div>
    </header>

    <main class="panel">
      <!-- QR, contadores y botones -->
      <aside class="lado">
        <div class="qr-card">
          <img src="qr-quiz.png" alt="QR code to join the game" />
          <strong>Scan to play</strong>
          <small id="enlace"></small>
        </div>
        <div class="stats">
          <div class="stat"><b id="nJugadores">0</b><span>Players</span></div>
          <div class="stat"><b id="nTerminaron">0</b><span>Finished</span></div>
        </div>
        <div class="controles">
          <button class="btn" id="btnPodio">Show podium</button>
          <button class="btn btn--rojo" id="btnReiniciar">New game</button>
        </div>
        <p class="conexion" id="conexion"></p>
      </aside>

      <!-- Tabla en vivo -->
      <section class="tabla-wrap">
        <div class="tabla-head">
          <h1>Live <b>Leaderboard</b></h1>
          <span class="en-vivo"><i></i>LIVE</span>
        </div>
        <ol class="filas" id="filas"></ol>
      </section>
    </main>
  </div>

  <!-- Podio -->
  <div class="podio" id="podio">
    <button class="btn btn--sec podio__cerrar" id="btnCerrarPodio">Back to leaderboard</button>
    <h2 class="podio__titulo">Champions<small>WHO KNOWS MORE ABOUT COLOMBIA?</small></h2>
    <div class="gradas" id="gradas"></div>
  </div>

  <div class="confeti" id="confeti"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="quiz-db.js?v=6"></script>
  <script>
    const $ = (s) => document.querySelector(s);
    $("#enlace").textContent = location.href.replace(/panel\.html.*$/, "quiz.html");
    const estados = {
      supabase: ["ok", "Database connected"],
      local: ["prueba", "Test mode: only players on this computer appear here"],
      error: ["mal", "Could not connect to the database. Reload the page."]
    };
    const [clase, texto] = estados[QuizDB.modo];
    $("#conexion").className = "conexion " + clase;
    $("#conexion").innerHTML = `<i></i>${texto}`;

    let ultimaLista = [];
    let firma = {};   // para saber qué fila cambió y hacerla brillar

    /* ---------- Pintar la tabla con animación de cambio de puesto ---------- */
    async function refrescar() {
      let lista;
      try { lista = await QuizDB.list(); } catch (e) { console.error(e); return; }
      ultimaLista = lista;
      $("#nJugadores").textContent = lista.length;
      $("#nTerminaron").textContent = lista.filter(p => p.finished).length;

      const ul = $("#filas");
      if (!lista.length) { ul.innerHTML = `<li class="vacio">Waiting for players... scan the QR code to join.</li>`; firma = {}; return; }

      // posiciones anteriores (para animar el cambio de lugar)
      const antes = {};
      ul.querySelectorAll(".jugador").forEach(li => (antes[li.dataset.id] = li.getBoundingClientRect().top));

      const nuevaFirma = {};
      ul.innerHTML = lista.map((p, i) => {
        const res = p.results || "";
        const cuadros = Array.from({ length: 10 }, (_, k) =>
          k < res.length ? `<i class="${res[k] === "1" ? "b" : "m"}"></i>` : (k === res.length && !p.finished ? `<i class="a"></i>` : `<i></i>`)).join("");
        const estado = p.finished ? "Finished" : res.length ? `Question ${res.length + 1}` : "Starting";
        nuevaFirma[p.id] = `${p.score}-${res}`;
        const cambio = firma[p.id] && firma[p.id] !== nuevaFirma[p.id] ? "cambio" : "";
        const medalla = ["oro", "plata", "bronce"][i];
        const puesto = i < 3 && p.score > 0 ? `<span class="medalla ${medalla}">${i + 1}</span>` : `<span class="puesto">${i + 1}</span>`;
        return `<li class="jugador ${i < 3 && p.score > 0 ? "lider" + (i + 1) : ""} ${cambio}" data-id="${p.id}">
          ${puesto}
          <span class="jnombre">${escaparHTML(p.name)}<small>${estado}</small></span>
          <span class="progreso">${cuadros}</span>
          <span class="jpuntos">${p.score} <small>pts</small></span>
        </li>`;
      }).join("");
      firma = nuevaFirma;

      // animación: cada fila se desliza desde su lugar anterior
      ul.querySelectorAll(".jugador").forEach(li => {
        const previo = antes[li.dataset.id];
        if (previo === undefined) return;
        const delta = previo - li.getBoundingClientRect().top;
        if (!delta) return;
        li.style.transition = "none";
        li.style.transform = `translateY(${delta}px)`;
        requestAnimationFrame(() => requestAnimationFrame(() => { li.style.transition = ""; li.style.transform = ""; }));
      });
    }

    /* ---------- Podio ---------- */
    function mostrarPodio() {
      const top = ultimaLista.slice(0, 3);
      const orden = [[1, "plata"], [0, "oro"], [2, "bronce"]];   // segundo, primero, tercero
      $("#gradas").innerHTML = orden.map(([i, tipo]) => {
        const p = top[i];
        return `<div class="grada grada--${tipo} ${p ? "" : "grada--vacia"}">
          <div class="grada__info">
            <div class="grada__medalla">${i + 1}</div>
            <div class="grada__nombre">${p ? escaparHTML(p.name) : "-"}</div>
            <div class="grada__pts">${p ? p.score + " pts" : ""}</div>
          </div>
          <div class="grada__bloque">${i + 1}</div>
        </div>`;
      }).join("");
      const podio = $("#podio");
      podio.classList.remove("activo");
      void podio.offsetWidth;            // reinicia la animación
      podio.classList.add("activo");
      setTimeout(lanzarConfeti, 2600);
    }
    $("#btnPodio").addEventListener("click", mostrarPodio);
    $("#btnCerrarPodio").addEventListener("click", () => $("#podio").classList.remove("activo"));

    function lanzarConfeti() {
      const colores = ["#FCD116", "#003893", "#CE1126", "#ffffff", "#f5c518"];
      const c = $("#confeti"); c.innerHTML = "";
      for (let i = 0; i < 180; i++) {
        const p = document.createElement("i");
        p.style.left = Math.random() * 100 + "%";
        p.style.background = colores[i % colores.length];
        p.style.animationDuration = 3 + Math.random() * 3 + "s";
        p.style.animationDelay = Math.random() * 1.5 + "s";
        c.appendChild(p);
      }
      setTimeout(() => (c.innerHTML = ""), 8000);
    }

    /* ---------- Nuevo juego (doble clic para confirmar) ---------- */
    let confirmar = null;
    $("#btnReiniciar").addEventListener("click", async () => {
      const b = $("#btnReiniciar");
      if (!confirmar) {
        b.textContent = "Click again to confirm";
        confirmar = setTimeout(() => { b.textContent = "New game"; confirmar = null; }, 3000);
        return;
      }
      clearTimeout(confirmar); confirmar = null;
      b.textContent = "Clearing...";
      try { await QuizDB.reset(); } catch (e) { console.error(e); }
      b.textContent = "New game";
      $("#podio").classList.remove("activo");
      refrescar();
    });

    refrescar();
    QuizDB.subscribe(refrescar);
  </script>
</body>
</html>
