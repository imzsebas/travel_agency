<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100">
  <!-- Mariposa tricolor original de Colombia Unveiled -->
  <g stroke="#1b2a4a" stroke-width="3" stroke-linejoin="round">
    <!-- alas de arriba (amarillo) -->
    <path d="M58 46 C40 10, 8 6, 8 28 C8 46, 30 54, 58 50 Z" fill="#FCD116"/>
    <path d="M62 46 C80 10, 112 6, 112 28 C112 46, 90 54, 62 50 Z" fill="#FCD116"/>
    <!-- alas de abajo (azul y rojo) -->
    <path d="M58 52 C36 54, 20 66, 26 80 C32 92, 52 84, 58 60 Z" fill="#003893"/>
    <path d="M62 52 C84 54, 100 66, 94 80 C88 92, 68 84, 62 60 Z" fill="#CE1126"/>
  </g>
  <!-- puntos decorativos -->
  <circle cx="28" cy="28" r="6" fill="#CE1126"/>
  <circle cx="92" cy="28" r="6" fill="#003893"/>
  <circle cx="40" cy="70" r="4" fill="#FCD116"/>
  <circle cx="80" cy="70" r="4" fill="#FCD116"/>
  <!-- cuerpo y antenas -->
  <path d="M54 22 Q48 8 40 6 M66 22 Q72 8 80 6" fill="none" stroke="#1b2a4a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="40" cy="6" r="3.5" fill="#1b2a4a"/>
  <circle cx="80" cy="6" r="3.5" fill="#1b2a4a"/>
  <rect x="55" y="20" width="10" height="66" rx="5" fill="#1b2a4a"/>
</svg>
